version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # PR titles feed release-please, so they must parse as conventional commits.
    commit-message:
      prefix: 'fix(deps)'
      prefix-development: 'chore(deps)'
    groups:
      # One PR for the lint/format toolchain instead of five: these move together
      # and a bump is never interesting on its own.
      dev-tooling:
        dependency-type: development
        # Minor and patch only. Grouped majors produced an internally inconsistent
        # PR — typescript 5 -> 7 alongside typescript-eslint 8, which does not
        # support it — that could never install, let alone pass.
        update-types:
          - minor
          - patch
        patterns:
          - '@typescript-eslint/*'
          - 'typescript-eslint'
          - 'eslint*'
          - 'prettier*'
          - 'typescript'
          - '@types/*'
    ignore:
      # Every runtime dependency: a major reaches a user's machine and can change
      # behaviour against a live instance, so it deserves a deliberate look rather
      # than a routine PR that sits there red.
      - dependency-name: 'ws'
        update-types: ['version-update:semver-major']
      - dependency-name: 'chokidar'
        update-types: ['version-update:semver-major']
      - dependency-name: 'commander'
        update-types: ['version-update:semver-major']
      - dependency-name: 'diff'
        update-types: ['version-update:semver-major']
      # Toolchain majors are migrations, not bumps. TypeScript 7 in particular is a
      # different compiler; typescript-eslint has to support it first.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # @types/node must track the OLDEST supported runtime, not the newest.
      # engines is ">=22", so types from Node 26 would let tsc accept APIs that do
      # not exist on Node 22 — code that typechecks here and throws on a user's
      # machine. CI only catches that if a test happens to exercise the call.
      # Raise this deliberately, together with the engines floor.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci(deps)'
